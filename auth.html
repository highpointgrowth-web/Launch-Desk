<!DOCTYPE html>
<html lang="en">
<head>
<script src="api.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In or Sign Up — LaunchDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --bg2:#f7f6f4;
  --surface:#ffffff;
  --surface2:#f7f6f4;
  --border:#ececea;
  --border2:#dddad5;
  --ink:#0a0a0a;
  --ink2:#71706b;
  --ink3:#a8a6a0;
  --indigo:#5c2333;
  --indigo-dark:#3f1824;
  --indigo-light:#f7ecee;
  --indigo-mid:#e6cbd1;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);
  --shadow-md:0 4px 24px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px}
.hidden{display:none !important}

.bg-glow{display:none}

.back-link{position:fixed;top:24px;left:28px;display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;color:var(--ink2);text-decoration:none;transition:color .15s}
.back-link:hover{color:var(--ink)}

.auth-card{position:relative;width:380px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md);padding:34px}

.auth-logo{display:flex;align-items:center;margin-bottom:30px}
/* Wordmark IS the mark - no icon, no box. "Launch" climbs letter by letter
   on translateY percentages (so it scales with font-size automatically),
   "Desk" lands level in the brand accent. */
.logo-text{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.03em;color:var(--ink);display:inline-flex}
.logo-text b{font-weight:800;display:inline-block}
.logo-text .lift1{transform:translateY(38%)}
.logo-text .lift2{transform:translateY(25%)}
.logo-text .lift3{transform:translateY(13%)}
.logo-text .lift5{transform:translateY(-13%)}
.logo-text .lift6{transform:translateY(-25%)}
.logo-text .accent{color:var(--indigo);display:inline-block}

.auth-tabs{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:3px;margin-bottom:24px}
.auth-tab{flex:1;text-align:center;padding:.55rem 0;border-radius:6px;border:none;background:none;cursor:pointer;font-family:'Archivo',system-ui,sans-serif;font-size:.82rem;font-weight:600;color:var(--ink2);transition:all .15s}
.auth-tab.active{background:var(--indigo);color:#fff}
.auth-tab:not(.active):hover{color:var(--ink)}

.auth-panel{display:none;flex-direction:column;gap:14px}
.auth-panel.active{display:flex}

.f-field{display:flex;flex-direction:column;gap:5px}
.f-label{font-size:.67rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.pw-wrap{position:relative}
.pw-wrap .f-input{width:100%;padding-right:2.4rem}
.pw-toggle{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink3);padding:2px;line-height:1;font-size:.95rem}
.pw-toggle:hover{color:var(--ink)}
.f-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.65rem .85rem;font-size:.86rem;color:var(--ink);font-family:'Archivo',system-ui,sans-serif;outline:none;transition:all .15s}
.f-input::placeholder{color:var(--ink3)}
.f-input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-light)}

.auth-error{display:none;padding:10px 12px;background:var(--red-bg);border-radius:8px;font-size:.78rem;color:var(--red);line-height:1.4}
.auth-error.visible{display:block}

.auth-submit{width:100%;margin-top:4px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:.88rem;padding:.72rem 1.2rem;border-radius:9px;border:none;cursor:pointer;transition:all .15s;background:var(--indigo);color:#fff;font-family:'Archivo',system-ui,sans-serif}
.auth-submit:hover{background:var(--indigo-dark);transform:translateY(-1px)}
.auth-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

.auth-switch{text-align:center;margin-top:18px;font-size:.8rem;color:var(--ink3)}
.auth-switch a{color:var(--indigo);text-decoration:none;font-weight:600;cursor:pointer}
.auth-switch a:hover{text-decoration:underline}

.auth-agree{display:flex;align-items:flex-start;gap:8px;font-size:.78rem;color:var(--ink2);line-height:1.4;cursor:pointer}
.auth-agree input{accent-color:var(--indigo);width:15px;height:15px;flex:none;margin-top:1px;cursor:pointer}
.auth-agree a{color:var(--indigo);text-decoration:none}
.auth-agree a:hover{text-decoration:underline}

.auth-remember{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink2);cursor:pointer;user-select:none}
.auth-remember input{accent-color:var(--indigo);width:15px;height:15px;flex:none;cursor:pointer}
</style>
</head>
<body>

<div class="bg-glow"></div>
<a class="back-link" href="index.html">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  Back to home
</a>

<div class="auth-card">
  <div class="auth-logo">
    <span class="logo-text"><b class="lift1">L</b><b class="lift2">a</b><b class="lift3">u</b><b>n</b><b class="lift5">c</b><b class="lift6">h</b><b class="accent">Desk</b></span>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Log In</button>
    <button class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
  </div>

  <!-- LOG IN -->
  <div class="auth-panel active" id="panel-login">
    <div class="f-field"><label class="f-label">Email</label><input class="f-input" id="login-email" type="email" placeholder="you@business.com" autocomplete="email"></div>
    <div class="f-field"><label class="f-label">Password</label><div class="pw-wrap"><input class="f-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"><button type="button" class="pw-toggle" onclick="togglePasswordVisibility(this)" aria-label="Show password">👁</button></div></div>
    <label class="auth-remember">
      <input type="checkbox" id="login-remember" checked>
      <span>Remember me</span>
    </label>
    <div class="auth-error" id="login-error"></div>
    <button class="auth-submit" id="login-submit" onclick="handleLoginSubmit()">Log In</button>
    <div class="auth-switch">Don't have an account? <a onclick="switchAuthTab('signup')">Sign up</a></div>
  </div>

  <!-- SIGN UP -->
  <div class="auth-panel" id="panel-signup">
    <div class="f-field"><label class="f-label">Name</label><input class="f-input" id="signup-name" type="text" placeholder="Your name" autocomplete="name"></div>
    <div class="f-field"><label class="f-label">Email</label><input class="f-input" id="signup-email" type="email" placeholder="you@business.com" autocomplete="email"></div>
    <div class="f-field"><label class="f-label">Password</label><div class="pw-wrap"><input class="f-input" id="signup-password" type="password" placeholder="••••••••" autocomplete="new-password"><button type="button" class="pw-toggle" onclick="togglePasswordVisibility(this)" aria-label="Show password">👁</button></div></div>
    <label class="auth-agree">
      <input type="checkbox" id="signup-terms-agree">
      <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a></span>
    </label>
    <div class="auth-error" id="signup-error"></div>
    <button class="auth-submit" id="signup-submit" onclick="handleSignupSubmit()">Create Account</button>
    <div class="auth-switch">Already have an account? <a onclick="switchAuthTab('login')">Log in</a></div>
  </div>
</div>

<script>
function togglePasswordVisibility(btn){
  const input = btn.previousElementSibling;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

function switchAuthTab(name){
  document.getElementById('tab-login').classList.toggle('active', name === 'login');
  document.getElementById('tab-signup').classList.toggle('active', name === 'signup');
  document.getElementById('panel-login').classList.toggle('active', name === 'login');
  document.getElementById('panel-signup').classList.toggle('active', name === 'signup');
}

function setError(id, message){
  const el = document.getElementById(id);
  if(message){
    el.textContent = message;
    el.classList.add('visible');
  } else {
    el.textContent = '';
    el.classList.remove('visible');
  }
}

async function handleLoginSubmit(){
  setError('login-error', '');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if(!email || !password){
    setError('login-error', 'Email and password are required.');
    return;
  }

  const btn = document.getElementById('login-submit');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Logging in…';

  try {
    const remember = document.getElementById('login-remember').checked;
    await API.auth.login({ email, password, remember });
    window.location.href = 'dashboard.html';
  } catch (err) {
    setError('login-error', err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function handleSignupSubmit(){
  setError('signup-error', '');
  const full_name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;

  if(!email || !password){
    setError('signup-error', 'Email and password are required.');
    return;
  }

  if(password.length < 8){
    setError('signup-error', 'Password must be at least 8 characters.');
    return;
  }

  if(!document.getElementById('signup-terms-agree').checked){
    setError('signup-error', 'You must agree to the Terms of Service and Privacy Policy to continue.');
    return;
  }

  const btn = document.getElementById('signup-submit');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Creating account…';

  try {
    await API.auth.signup({ email, password, full_name });
    // signup() doesn't establish a session by itself - log in right after
    // so dashboard.html finds a valid token instead of bouncing back to auth.
    await API.auth.login({ email, password });
    window.location.href = 'dashboard.html';
  } catch (err) {
    setError('signup-error', err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

if(new URLSearchParams(window.location.search).get('expired') === '1'){
  setError('login-error', 'Your session expired, please log in again.');
}

// Every "Get started" CTA on the marketing site linked here with no way to
// land on the Sign Up tab - new visitors were landing on Log In (asking for
// a password they don't have) instead of the form that actually gets them
// started.
if(new URLSearchParams(window.location.search).get('tab') === 'signup'){
  switchAuthTab('signup');
}
</script>

</body>
</html>
